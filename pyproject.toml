[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fretpilot"
version = "0.1.0"
description = "AI-assisted MIDI-to-guitar notation and performance engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "mido>=1.3",
    "python-multipart>=0.0.20,<1",
    "PyGuitarPro>=0.11,<0.12",
    "reportlab>=4.2,<5",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8",
]

[project.scripts]
fretpilot = "fretpilot.cli:main"
fretpilot-api = "fretpilot.api_cli:main"
fretpilot-pdf = "fretpilot.pdf_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fretpilot = ["knowledge/assets/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
