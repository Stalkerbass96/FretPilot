[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fretpilot"
version = "0.1.0"
description = "AI-assisted MIDI-to-guitar notation and performance engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
fretpilot = "fretpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
